name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      - run: python -m pip install -r requirements.txt setuptools wheel
      - run: npm test
      - run: npm run test:python
      - run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir artifacts
      - run: python scripts/verify-wheel.py
      - run: npm pack --dry-run
